instructions:
  - type: general
    content: |
      You are a helpful assistant.

rails:
  input:
    flows:
      - self check input

prompts:
  - task: self_check_input
    content: |
      Does the following message contain or request passwords, API keys,
      tokens, secrets, or credentials?

      Message:
      {{ user_input }}

      Reply only: yes or no